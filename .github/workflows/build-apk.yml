name: Build GhostScript Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GhostScript APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/GhostScript-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostScript-v1.0.0-APK
          path: release-output/GhostScript-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "GhostScript Root v1.0.0 - Autonomous Background Micro-Scripts"
          body: |
            ### 👻 GhostScript Root v1.0.0: Autonomous Background Micro-Scripts

            - **Smart Sleep & Lock Timer:**
              - Puts screen to sleep reliably (`cmd power sleep` / `keyevent 223`).
              - Optional media pause (`cmd media_session dispatch pause`), mute, Wi-Fi off, and Bluetooth off.
              - Dormant kernel sleep (0% idle CPU and virtually zero battery usage).
            - **Autonomous Background Execution:**
              - Scripts run detached via root and write status/logs locally.
              - Clean instant termination on completion or manual stop.
            - **Smart Built-in Presets:**
              - Drop caches & RAM purge (`echo 3 > /proc/sys/vm/drop_caches`).
              - Freeze/Kill background processes (`am kill-all`).
              - Scheduled phone shutdown (`reboot -p`) or reboot (`reboot`).
              - Ultra power saver mode (`cmd power set-mode 1`).
            - **Custom Ghost Script Runner & Builder:**
              - Write, run, and save custom root shell scripts with optional delay.
              - Live terminal log inspector and process monitor.
            - **Modern AMOLED Dark UI:**
              - Frame-0 instant hydration, responsive touch feedback, RTL Arabic interface.
          files: release-output/GhostScript-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
